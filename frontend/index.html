<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northgate Handbook Assistant</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
          <rect width="48" height="48" rx="13" fill="#fff"/>
          <path d="M14 34 L22 22 L32 26" fill="none" stroke="#6d28d9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="14" cy="34" r="3.5" fill="#6d28d9"/>
          <circle cx="22" cy="22" r="3.5" fill="#6d28d9"/>
          <path d="M32 21 L37 26 L32 31" fill="none" stroke="#6d28d9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <p class="company">Northgate Robotics</p>
          <h1>Handbook Assistant</h1>
        </div>
      </div>
    </aside>

    <div class="main">
      <main class="page">
        <section id="welcome" class="welcome">
          <h2>What would you like to know?</h2>
          <p>Ask about leave, travel, expenses, IT, engineering runbooks or teams. Every answer links to the passage it comes from.</p>
          <div class="examples">
            <button type="button" class="example">How many days of annual leave do I get?</button>
            <button type="button" class="example">What's the most I can pay for a hotel in Boston?</button>
            <button type="button" class="example">How much paid leave does a secondary caregiver get?</button>
            <button type="button" class="example">Can I work remotely from another country?</button>
          </div>
        </section>

        <section id="conversation" class="conversation" aria-live="polite"></section>
      </main>

      <form id="ask-form" class="composer">
        <label for="question" class="visually-hidden">Your question</label>
        <input id="question" name="question" type="text" maxlength="500" autocomplete="off"
               placeholder="Ask a question about the handbook…" required>
        <button id="ask-button" type="submit">Ask</button>
      </form>
    </div>
  </div>

  <div id="backdrop" class="backdrop" hidden></div>
  <aside id="source-panel" class="source-panel" aria-labelledby="source-title" hidden>
    <div class="source-header">
      <div>
        <h2 id="source-title"></h2>
        <p id="source-meta" class="source-meta"></p>
      </div>
      <button id="close-source" type="button" class="icon-button" aria-label="Close source">✕</button>
    </div>
    <div id="source-labels" class="labels"></div>
    <a id="source-file" class="file-link" target="_blank" rel="noopener">Open original file ↗</a>
    <article id="source-body" class="source-body"></article>
  </aside>

  <script src="/js/app.js"></script>
</body>
</html>
